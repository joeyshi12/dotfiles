# Generated by scripts/theme.sh from theme/palette.sh. Do not edit.
# tmux status bar and pane styling in the WakeNight palette.

# Status bar: a step lighter than the terminal so it doesn't blend in
set -g status-style "bg=${BG_LIGHTER},fg=${FG}"
set -g status-left-length 30
set -g status-left "#[fg=${FG_MUTED}] #S  "
set -g status-right-length 60
set -g status-right "#[fg=${FG_MUTED}]#H  %Y-%m-%d %H:%M "

# Windows: number block, then the window name
set -g window-status-separator " "
set -g window-status-format "#[fg=${BG},bg=${FG_DIM}] #I #[fg=${FG},bg=${BG_ALT}] #W "
set -g window-status-current-format "#[fg=${BG},bg=${ACCENT},bold] #I #[fg=${FG},bg=${BG_ALT_LIGHTER},nobold] #W "
# tmux 3.8 underlines the current window by default
set -g window-status-current-style default
set -g window-status-activity-style "fg=${URGENT}"
set -g window-status-bell-style "fg=${BG},bg=${URGENT}"

# Panes, messages, copy mode and the clock
set -g pane-border-style "fg=${BG_ALT}"
set -g pane-active-border-style "fg=${ACCENT}"
set -g message-style "fg=${FG},bg=${BG_ALT}"
set -g message-command-style "fg=${FG},bg=${BG_ALT}"
set -g mode-style "fg=${FG},bg=${BG_ALT_LIGHTER}"
set -g copy-mode-match-style "fg=${BG},bg=${FG_DIM}"
set -g copy-mode-current-match-style "fg=${BG},bg=${URGENT}"
set -g clock-mode-colour "${ACCENT}"
