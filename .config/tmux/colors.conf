# Generated by scripts/theme.sh from theme/palette.sh. Do not edit.
# tmux status bar and pane styling in the WakeNight palette.

# Status bar: a step lighter than the terminal so it doesn't blend in
set -g status-style "bg=#1b293b,fg=#e8f4f8"
set -g status-left-length 30
set -g status-left "#[fg=#96a3ae] #S  "
set -g status-right-length 60
set -g status-right "#[fg=#96a3ae]#H  %Y-%m-%d %H:%M "

# Windows: number block, then the window name
set -g window-status-separator " "
set -g window-status-format "#[fg=#0f1825,bg=#6b8494] #I #[fg=#e8f4f8,bg=#253447] #W "
set -g window-status-current-format "#[fg=#0f1825,bg=#418aa2,bold] #I #[fg=#e8f4f8,bg=#35495f,nobold] #W "
# tmux 3.8 underlines the current window by default
set -g window-status-current-style default
set -g window-status-activity-style "fg=#f4d06f"
set -g window-status-bell-style "fg=#0f1825,bg=#f4d06f"

# Panes, messages, copy mode and the clock
set -g pane-border-style "fg=#253447"
set -g pane-active-border-style "fg=#418aa2"
set -g message-style "fg=#e8f4f8,bg=#253447"
set -g message-command-style "fg=#e8f4f8,bg=#253447"
set -g mode-style "fg=#e8f4f8,bg=#35495f"
set -g copy-mode-match-style "fg=#0f1825,bg=#6b8494"
set -g copy-mode-current-match-style "fg=#0f1825,bg=#f4d06f"
set -g clock-mode-colour "#418aa2"
